<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <radialGradient id="space" cx=".5" cy=".55" r=".75"><stop offset="0" stop-color="#160f38"/><stop offset=".55" stop-color="#080a1c"/><stop offset="1" stop-color="#03040a"/></radialGradient>
    <radialGradient id="neb1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7c3aed" stop-opacity=".35"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#0ea5e9" stop-opacity=".28"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff"/><stop offset=".2" stop-color="#c4b5fd"/><stop offset=".55" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>
  <rect width="640" height="360" fill="url(#space)"/>
  <ellipse cx="110" cy="80" rx="200" ry="140" fill="url(#neb1)"/>
  <ellipse cx="560" cy="300" rx="220" ry="150" fill="url(#neb2)"/>
  <g fill="#fff">
    <circle cx="40" cy="30" r="1.2" opacity=".8"/><circle cx="90" cy="300" r="1" opacity=".6"/><circle cx="150" cy="140" r="1.4" opacity=".7"/><circle cx="210" cy="40" r="1" opacity=".6"/><circle cx="560" cy="40" r="1.5" opacity=".8"/><circle cx="600" cy="150" r="1" opacity=".6"/><circle cx="500" cy="110" r="1.1" opacity=".7"/><circle cx="470" cy="330" r="1" opacity=".5"/><circle cx="60" cy="210" r="1.2" opacity=".6"/><circle cx="620" cy="250" r="1.2" opacity=".7"/><circle cx="20" cy="120" r="1" opacity=".6"/><circle cx="180" cy="330" r="1.3" opacity=".6"/>
  </g>
  <!-- finish line -->
  <line x1="320" y1="140" x2="320" y2="14" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>
  <!-- orbit paths -->
  <g fill="none" stroke-width="1.5">
    <circle cx="320" cy="180" r="56" stroke="#fb923c" stroke-opacity=".35"/>
    <circle cx="320" cy="180" r="80" stroke="#facc15" stroke-opacity=".3"/>
    <circle cx="320" cy="180" r="104" stroke="#a3e635" stroke-opacity=".3"/>
    <circle cx="320" cy="180" r="128" stroke="#34d399" stroke-opacity=".3"/>
    <circle cx="320" cy="180" r="152" stroke="#22d3ee" stroke-opacity=".3"/>
    <circle cx="320" cy="180" r="176" stroke="#60a5fa" stroke-opacity=".25"/>
  </g>
  <!-- trails (arcs) -->
  <g fill="none" stroke-linecap="round" filter="url(#soft)">
    <path d="M264 180A56 56 0 0 1 343 129" stroke="#fb923c" stroke-width="7" stroke-opacity=".8"/>
    <path d="M400 180A80 80 0 0 1 320 260" stroke="#facc15" stroke-width="7" stroke-opacity=".75"/>
    <path d="M230 128A104 104 0 0 1 393 107" stroke="#a3e635" stroke-width="8" stroke-opacity=".75"/>
    <path d="M320 308A128 128 0 0 1 192 180" stroke="#34d399" stroke-width="8" stroke-opacity=".7"/>
    <path d="M470 160A152 152 0 0 1 400 309" stroke="#22d3ee" stroke-width="9" stroke-opacity=".7"/>
    <path d="M150 230A176 176 0 0 1 200 52" stroke="#60a5fa" stroke-width="9" stroke-opacity=".7"/>
  </g>
  <!-- orbs -->
  <g filter="url(#blur)">
    <circle cx="343" cy="129" r="12" fill="#fb923c"/><circle cx="320" cy="260" r="12" fill="#facc15"/><circle cx="393" cy="107" r="13" fill="#a3e635"/><circle cx="192" cy="180" r="13" fill="#34d399"/><circle cx="400" cy="309" r="14" fill="#22d3ee"/><circle cx="200" cy="52" r="14" fill="#60a5fa"/>
  </g>
  <g fill="#fff"><circle cx="343" cy="129" r="5"/><circle cx="320" cy="260" r="5"/><circle cx="393" cy="107" r="5.5"/><circle cx="192" cy="180" r="5.5"/><circle cx="400" cy="309" r="6"/><circle cx="200" cy="52" r="6"/></g>
  <!-- core -->
  <circle cx="320" cy="180" r="62" fill="url(#core)"/>
  <circle cx="320" cy="180" r="11" fill="#fff"/>
  <!-- revolution burst at the top -->
  <g fill="#a3e635"><rect x="318" y="72" width="4" height="4"/><rect x="306" y="66" width="3" height="3"/><rect x="332" y="64" width="3" height="3"/><rect x="300" y="80" width="3" height="3"/><rect x="340" y="82" width="3" height="3"/><rect x="326" y="56" width="3" height="3"/></g>
  <text x="342" y="66" font-family="system-ui,Arial,sans-serif" font-weight="800" font-size="20" fill="#a3e635" stroke="#000" stroke-opacity=".6" stroke-width="4" paint-order="stroke">+1.98K</text>
  <!-- HUD -->
  <text x="22" y="50" font-family="system-ui,Arial,sans-serif" font-weight="900" font-size="34" fill="#fff"><tspan fill="#c4b5fd">✦</tspan>7.31M</text>
  <text x="24" y="74" font-family="system-ui,Arial,sans-serif" font-weight="800" font-size="17" fill="#fde68a">+28.1K /s</text>
  <rect x="514" y="18" width="108" height="34" rx="17" fill="#04050d" fill-opacity=".7" stroke="#fff" stroke-opacity=".2"/>
  <text x="568" y="41" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-weight="800" font-size="17" fill="#e9d5ff">12 ◐</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="ceil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140e0b"/>
      <stop offset="1" stop-color="#4a372c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3029"/>
      <stop offset="1" stop-color="#1b1410"/>
    </linearGradient>
    <pattern id="brick" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#3b2a22"/>
      <rect x="1" y="1" width="38" height="8" fill="#9a5638"/>
      <rect x="-19" y="11" width="38" height="8" fill="#8a4b34"/>
      <rect x="21" y="11" width="38" height="8" fill="#a35d3d"/>
      <rect x="1" y="1" width="38" height="2" fill="#b8704f"/>
    </pattern>
    <pattern id="metal" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#1c1f26"/>
      <rect x="2" y="2" width="44" height="44" fill="#6b7380"/>
      <rect x="2" y="2" width="44" height="3" fill="#8b94a3"/>
      <circle cx="7" cy="7" r="1.6" fill="#2a2d35"/><circle cx="41" cy="7" r="1.6" fill="#2a2d35"/>
      <circle cx="7" cy="41" r="1.6" fill="#2a2d35"/><circle cx="41" cy="41" r="1.6" fill="#2a2d35"/>
      <rect x="30" y="8" width="3" height="18" fill="#8a4a24" opacity=".35"/>
    </pattern>
    <pattern id="hazard" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="28" height="28" fill="#f5b301"/>
      <rect width="14" height="28" fill="#1b1b1b"/>
    </pattern>
    <radialGradient id="flash">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset=".35" stop-color="#ffd65a"/>
      <stop offset=".75" stop-color="#ff7a14" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff5000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".6"/>
    </radialGradient>
    <linearGradient id="gun" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c1f25"/>
      <stop offset=".5" stop-color="#565e6e"/>
      <stop offset="1" stop-color="#1c1f25"/>
    </linearGradient>
  </defs>
  <rect width="640" height="180" fill="url(#ceil)"/>
  <rect y="180" width="640" height="180" fill="url(#floor)"/>
  <!-- corridor walls -->
  <polygon points="0,0 210,92 210,268 0,360" fill="url(#brick)"/>
  <polygon points="0,0 210,92 210,268 0,360" fill="#000" opacity=".18"/>
  <polygon points="640,0 430,92 430,268 640,360" fill="url(#metal)"/>
  <polygon points="640,0 430,92 430,268 640,360" fill="#000" opacity=".28"/>
  <rect x="210" y="92" width="220" height="176" fill="#4b5059"/>
  <rect x="210" y="140" width="220" height="70" fill="url(#hazard)"/>
  <rect x="210" y="92" width="220" height="176" fill="#3d3029" opacity=".38"/>
  <rect x="210" y="208" width="220" height="5" fill="#000" opacity=".35"/>
  <!-- far robot (cyan) -->
  <g transform="translate(372 150) scale(.55)">
    <rect x="-14" y="62" width="10" height="30" fill="#3b414e"/><rect x="4" y="62" width="10" height="30" fill="#3b414e"/>
    <polygon points="-22,28 22,28 15,60 -15,60" fill="#06b6d4"/>
    <rect x="-31" y="26" width="15" height="13" fill="#04798d"/><rect x="16" y="26" width="15" height="13" fill="#04798d"/>
    <path d="M-12 26 V10 Q0 -1 12 10 V26 Z" fill="#3b414e"/>
    <rect x="-9" y="13" width="18" height="5" fill="#a5f3fc"/>
  </g>
  <!-- main robot (red) -->
  <g transform="translate(320 104) scale(1.05)">
    <ellipse cx="0" cy="140" rx="46" ry="7" fill="#000" opacity=".35"/>
    <rect x="-24" y="88" width="17" height="48" fill="#262a33"/><rect x="7" y="88" width="17" height="48" fill="#262a33"/>
    <rect x="-22" y="88" width="13" height="44" fill="#3b414e"/><rect x="9" y="88" width="13" height="44" fill="#3b414e"/>
    <rect x="-26" y="108" width="20" height="9" fill="#ef4444"/><rect x="6" y="108" width="20" height="9" fill="#ef4444"/>
    <rect x="-28" y="132" width="22" height="9" fill="#16181e"/><rect x="6" y="132" width="22" height="9" fill="#16181e"/>
    <rect x="-22" y="82" width="44" height="12" fill="#262a33"/>
    <polygon points="-36,40 36,40 25,86 -25,86" fill="#8f1d1d"/>
    <polygon points="-30,42 30,42 21,82 -21,82" fill="#ef4444"/>
    <rect x="-23" y="46" width="46" height="5" fill="#f9a8a8"/>
    <circle cx="0" cy="62" r="12" fill="#fff" opacity=".35"/><circle cx="0" cy="62" r="7" fill="#e8fbff"/>
    <rect x="-50" y="37" width="23" height="20" fill="#8f1d1d"/><rect x="27" y="37" width="23" height="20" fill="#8f1d1d"/>
    <rect x="-48" y="37" width="19" height="6" fill="#f9a8a8"/><rect x="29" y="37" width="19" height="6" fill="#f9a8a8"/>
    <rect x="-46" y="56" width="14" height="22" fill="#3b414e"/><rect x="32" y="56" width="14" height="22" fill="#3b414e"/>
    <rect x="-36" y="72" width="72" height="11" fill="#262a33"/>
    <rect x="-13" y="66" width="26" height="22" fill="#15171d"/>
    <circle cx="0" cy="77" r="5" fill="#000"/>
    <path d="M-18 36 V14 Q0 -2 18 14 V36 Z" fill="#3b414e"/>
    <rect x="-12" y="6" width="24" height="5" fill="#5d6577"/>
    <rect x="-15" y="17" width="30" height="12" fill="#0c0e14"/>
    <rect x="-13" y="20" width="26" height="6" fill="#fca5a5"/>
    <rect x="13" y="-6" width="3" height="14" fill="#262a33"/><rect x="12" y="-8" width="6" height="4" fill="#ef4444"/>
    <!-- hit sparks -->
    <g fill="#ffd27a"><rect x="-6" y="52" width="5" height="5"/><rect x="9" y="47" width="4" height="4"/><rect x="-14" y="60" width="4" height="4"/><rect x="14" y="66" width="3" height="3"/></g>
  </g>
  <!-- health bar above the robot -->
  <rect x="285" y="88" width="70" height="6" rx="3" fill="#000" opacity=".55"/>
  <rect x="285" y="88" width="26" height="6" rx="3" fill="#f87171"/>
  <!-- crosshair + hit marker -->
  <g stroke="#ff6b6b" stroke-width="3" stroke-linecap="round">
    <path d="M300 180h10M330 180h10M320 160v10M320 190v10"/>
  </g>
  <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9">
    <path d="M306 166l-6-6M334 166l6-6M306 194l-6 6M334 194l6 6"/>
  </g>
  <!-- weapon + muzzle flash -->
  <g transform="translate(70 0)"><polygon points="250,360 262,310 378,310 390,360" fill="#262a33"/>
  <polygon points="276,360 298,276 342,276 364,360" fill="url(#gun)"/>
  <polygon points="302,276 338,276 334,267 306,267" fill="#7a8394"/>
  <rect x="306" y="288" width="28" height="5" fill="#101216"/><rect x="306" y="300" width="28" height="5" fill="#101216"/>
  <rect x="314" y="320" width="12" height="5" fill="#2dd4f0"/>
  <circle cx="320" cy="262" r="40" fill="url(#flash)"/>
  <polygon points="320,232 327,254 352,250 332,264 346,288 321,272 300,292 309,266 286,260 311,254" fill="#fff6c8" opacity=".9"/></g>
  <ellipse cx="306" cy="356" rx="40" ry="28" fill="#2a2d35"/><ellipse cx="474" cy="356" rx="40" ry="28" fill="#2a2d35"/>
  <rect width="640" height="360" fill="url(#vig)"/>
  <!-- HUD -->
  <rect x="14" y="14" width="128" height="34" rx="17" fill="#05060e" opacity=".7"/>
  <text x="30" y="37" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff">KILLS 12/15</text>
  <rect x="280" y="14" width="80" height="30" rx="15" fill="#05060e" opacity=".7"/>
  <text x="320" y="35" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff">2:47</text>
  <rect x="16" y="318" width="150" height="22" rx="11" fill="#05060e" opacity=".7"/>
  <rect x="50" y="326" width="106" height="7" fill="#34d399"/>
  <text x="26" y="335" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="900" fill="#34d399">+</text>
  <rect x="520" y="308" width="106" height="36" rx="18" fill="#05060e" opacity=".7"/>
  <text x="600" y="334" text-anchor="end" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="22" font-weight="900" fill="#fff">24<tspan font-size="14" fill="#c4c8ea"> / 90</tspan></text>
  <rect x="470" y="66" width="156" height="22" rx="11" fill="#8b6cff" opacity=".6"/>
  <text x="548" y="82" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#fff">You [SMG] Rook</text>
</svg>
